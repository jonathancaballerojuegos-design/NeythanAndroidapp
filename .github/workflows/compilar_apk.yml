name: Compilar Neythan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python y recortar sprites automaticamente
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Pillow y NumPy y ejecutar recorte
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy
          if [ -f "recortar_todas_cuadriculas.py" ]; then
            python recortar_todas_cuadriculas.py
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar entorno Gradle y AndroidX
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NeythanAndroidapp"
          include(":app")
          EOF
          fi
          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          fi
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug

      - name: Subir APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Neythan-APK
          path: app/build/outputs/apk/debug/*.apk
