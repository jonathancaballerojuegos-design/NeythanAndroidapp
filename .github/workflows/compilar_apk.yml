name: Compilar Neythan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python y recortar sprites automaticamente
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Pillow y NumPy y ejecutar recorte
        run: |
          pip install pillow numpy
          python recortar_todas_cuadriculas.py

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar entorno Gradle y AndroidX
        run: |
          chmod +x gradlew
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug

      - name: Subir APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Neythan-APK
          path: app/build/outputs/apk/debug/app-debug.apk
