name: Compilar Neythan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar entorno Gradle y AndroidX
        run: |
          echo "rootProject.name = \"NeythanAndroidApp\"" > settings.gradle.kts
          echo "include(\":app\")" >> settings.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF
          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle wrapper --gradle-version 8.4

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug

      - name: Subir APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Neythan-Chibi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
