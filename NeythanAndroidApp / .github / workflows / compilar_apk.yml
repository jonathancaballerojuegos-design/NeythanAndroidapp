name: Compilar Neythan APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar entorno Gradle
        run: |
          echo "rootProject.name = 'NeythanAndroidApp'" > settings.gradle.kts
          echo "include(':app')" >> settings.gradle.kts
          gradle wrapper --gradle-version 8.4

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug

      - name: Subir APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Neythan-Chibi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
